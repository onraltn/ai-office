[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-office"
version = "0.1.0"
description = "Alfred and a repository-aware Developer Agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "PyYAML>=6,<7", "langgraph>=0.2,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
office = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
